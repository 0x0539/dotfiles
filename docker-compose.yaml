name: core

services:
  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: qwen38
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/.models:/models
    environment:
      - LLAMA_CACHE=/models
    command: >
      -hf unsloth/Qwen3.8-27B-GGUF:UD-Q5_K_XL
      --alias qwen3.8-27b
      --host 0.0.0.0 --port 8080
      --jinja
      --ctx-size 160000
      --fit off
      --gpu-layers 99
      --gpu-layers-draft 99
      -fa on
      --kv-unified
      --cache-type-k q8_0 --cache-type-v q8_0
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --parallel 1
      --batch-size 2048
      --ubatch-size 512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
